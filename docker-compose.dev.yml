# ═════════════════════════════════════════════════════════════════════════════
# ElVuelto — DEV override.
#
# Source is bind-mounted, both dev servers run with reload, DEBUG comes from
# elvuelto.settings.local. Layered on top of docker-compose.yml:
#
#   ./scripts/manage-docker.sh up dev
# ═════════════════════════════════════════════════════════════════════════════

services:
  backend:
    build:
      target: dev
    environment:
      DJANGO_SETTINGS_MODULE: elvuelto.settings.local
    volumes:
      # Editing a .py file reloads runserver. Note this also brings the host's
      # .env back into the container (it is excluded from the image on purpose).
      - ./el_vuelto_backend:/app
    # runserver already reloads on change; --noreload would break that.
    command: python manage.py runserver 0.0.0.0:8000
    stdin_open: true
    tty: true

  frontend:
    build:
      target: dev
    environment:
      # The browser reaches the HMR socket through nginx, not Vite directly, so
      # the client has to be told the PUBLISHED port. Read by vite.config.ts.
      VITE_HMR_CLIENT_PORT: ${APP_PORT:-5173}
    volumes:
      - ./el_vuelto_frontend:/app
      # Must come AFTER the bind mount above, and must exist: without it the
      # host's darwin-arm64 node_modules shadows the container's linux-arm64
      # install and Vite dies on a wrong-architecture esbuild binary.
      #
      # Trap: this volume is seeded once. After changing package.json, run
      # `./scripts/manage-docker.sh clean dev` or the old tree survives.
      - elvuelto_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

  nginx:
    image: nginx:alpine
    volumes:
      # Bind-mounted rather than baked in, so routing can be edited and applied
      # with `restart dev nginx` instead of a rebuild.
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/proxy_common.conf:/etc/nginx/proxy_common.conf:ro

volumes:
  elvuelto_node_modules:
