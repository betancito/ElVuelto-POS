# ═════════════════════════════════════════════════════════════════════════════
# ElVuelto — edge proxy, DEV
#
# Two listeners, matching the ports the services use internally so a port number
# means the same thing inside and outside Docker:
#
#   :5173  the application, single origin. "/" is the Vite dev server, "/api/"
#          and friends are Django. Because both live on one origin the browser
#          issues no CORS preflight and the bundle contains no host:port.
#          ← this is the URL to open from the phone.
#
#   :8000  the backend, straight through. For curl/Postman, /docs/ and the
#          Django admin without the SPA in the way.
#
# Only this container publishes ports; backend and frontend are reachable only
# on the internal compose network, by service name.
# ═════════════════════════════════════════════════════════════════════════════

# Vite's HMR channel is a WebSocket. The Connection header must be "upgrade"
# for the handshake and "close" for ordinary requests — hardcoding "upgrade"
# breaks keep-alive on every normal page load.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Respeta el X-Forwarded-Proto de un TLS terminator de más afuera (Caddy,
# App Gateway). Sin nada delante no viene, y cae a $scheme. Ver proxy_common.conf.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

upstream elvuelto_backend {
    server backend:8000;
}

upstream elvuelto_frontend {
    server frontend:5173;
}

# ── :5173 — the app, same origin ─────────────────────────────────────────────
server {
    listen 5173;
    server_name _;

    # Product images and tenant logos are uploaded through here.
    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Django ───────────────────────────────────────────────────────────────
    # /api/ also covers /api/schema/.
    location /api/ {
        include /etc/nginx/proxy_common.conf;
        proxy_pass http://elvuelto_backend;
    }

    location /admin/ {
        include /etc/nginx/proxy_common.conf;
        proxy_pass http://elvuelto_backend;
    }

    # Swagger and Redoc are Django routes (gated by DOCS_API_KEY). Without these
    # two blocks they would fall through to "/" and Vite would answer the SPA.
    location /docs/ {
        include /etc/nginx/proxy_common.conf;
        proxy_pass http://elvuelto_backend;
    }

    location /redoc/ {
        include /etc/nginx/proxy_common.conf;
        proxy_pass http://elvuelto_backend;
    }

    # In dev Django serves both itself (staticfiles app + the static() call in
    # elvuelto/urls.py). In prod nginx serves them from a volume instead.
    location /static/ {
        include /etc/nginx/proxy_common.conf;
        proxy_pass http://elvuelto_backend;
    }

    location /media/ {
        include /etc/nginx/proxy_common.conf;
        proxy_pass http://elvuelto_backend;
    }

    # ── Vite dev server ──────────────────────────────────────────────────────
    location / {
        include /etc/nginx/proxy_common.conf;
        proxy_pass http://elvuelto_frontend;

        # Without these three the HMR socket fails silently: the page loads,
        # edits never arrive, and the console fills with WebSocket errors.
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        # An idle HMR socket must not be reaped after the default 60s.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # The dev server streams module updates; buffering delays them.
        proxy_buffering off;
    }
}

# ── :8000 — backend passthrough ──────────────────────────────────────────────
server {
    listen 8000;
    server_name _;

    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        include /etc/nginx/proxy_common.conf;
        proxy_pass http://elvuelto_backend;
    }
}
