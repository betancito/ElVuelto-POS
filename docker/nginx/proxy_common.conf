# Headers every proxied location must set. Included from dev.conf and prod.conf.

# $http_host, NOT $host — this is the single most important line in the file.
#
# $host drops the port. Reaching the app at http://192.168.1.75:5173, the
# browser sends `Origin: http://192.168.1.75:5173` but $host would forward
# `Host: 192.168.1.75`. Django then builds request.get_host() without the port,
# it no longer matches the Origin header, and CsrfViewMiddleware rejects every
# POST with 403 "Origin checking failed" — including the admin login.
# $http_host forwards the Host exactly as the client sent it, port included.
proxy_set_header Host              $http_host;

proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# $forwarded_proto, NO $scheme — la segunda trampa de este archivo.
#
# Cuando hay un TLS terminator DELANTE de este nginx (Caddy, Application
# Gateway, un load balancer), ese borde recibe https y nos habla por http
# adentro de la red privada. Con `$scheme` nginx escribiría `http` ENCIMA del
# `https` que el borde ya había puesto, y Django —con SECURE_SSL_REDIRECT—
# vería http, redirigiría a https, el borde volvería a entrar por http… un
# bucle infinito de redirecciones que además rompe el chequeo de Origin.
# El `map` de abajo respeta el valor entrante si viene, y cae a $scheme si no
# (que es el caso de hoy: sin nada delante, nginx ES el borde).
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host  $http_host;

proxy_redirect off;
