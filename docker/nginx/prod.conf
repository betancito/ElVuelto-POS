# ═════════════════════════════════════════════════════════════════════════════
# ElVuelto — edge proxy, PROD
#
# Same two listeners and the same routes as dev.conf, so a URL that works in
# development works here. Three things change:
#   • "/" is the frontend's own nginx serving the built dist/, not Vite.
#   • no WebSocket upgrade on "/" — there is no HMR in a production build.
#   • /static/ and /media/ are served straight off the shared volumes instead
#     of being proxied to Django (which does not serve them with DEBUG=False).
# ═════════════════════════════════════════════════════════════════════════════

# Respeta el X-Forwarded-Proto de un TLS terminator de más afuera (Caddy,
# App Gateway). Sin nada delante no viene, y cae a $scheme. Ver proxy_common.conf.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

upstream elvuelto_backend {
    server backend:8000;
}

upstream elvuelto_frontend {
    server frontend:5173;
}

# ── :5173 — the app, same origin ─────────────────────────────────────────────
server {
    listen 5173;
    server_name _;

    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Django ───────────────────────────────────────────────────────────────
    location /api/ {
        include /etc/nginx/proxy_common.conf;
        proxy_pass http://elvuelto_backend;
    }

    location /admin/ {
        include /etc/nginx/proxy_common.conf;
        proxy_pass http://elvuelto_backend;
    }

    location /docs/ {
        include /etc/nginx/proxy_common.conf;
        proxy_pass http://elvuelto_backend;
    }

    location /redoc/ {
        include /etc/nginx/proxy_common.conf;
        proxy_pass http://elvuelto_backend;
    }

    # Written by `collectstatic` into the static volume on backend startup.
    # With DEBUG=False Django refuses to serve these, so nginx must.
    location /static/ {
        alias /vol/static/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Near-empty in practice: product images and tenant logos go to Cloudinary.
    # Kept so any local upload still resolves.
    location /media/ {
        alias /vol/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── built SPA ────────────────────────────────────────────────────────────
    location / {
        include /etc/nginx/proxy_common.conf;
        proxy_pass http://elvuelto_frontend;
    }
}

# ── :8000 — backend passthrough ──────────────────────────────────────────────
server {
    listen 8000;
    server_name _;

    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        alias /vol/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /vol/media/;
        expires 7d;
        access_log off;
    }

    location / {
        include /etc/nginx/proxy_common.conf;
        proxy_pass http://elvuelto_backend;
    }
}
